<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRI KADESHWARA LAY CUTTING</title>
  <link rel="icon" type="image/jpeg" href="images/LogoKLC.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<div id="globalLoader" style="display:none;">
  <div class="loader-backdrop"></div>
  <div class="loader-content">
    <div class="spinner"></div>
    <div class="loader-text">Loading…</div>
  </div>
</div>


<body>


  <!-- Navbar -->
  <nav class="nav">
    <div data-view="home" class="nav-link logo-container">
      <img src="images/LogoKLC.png" alt="SRI KADESHWARA LAY CUTTING Logo" class="logo">
      <span>SRI KADESHWARA LAY CUTTING</span>
  </div>
  <button id="btnLogout" class="logout-btn" style="display:none;">
    <i class="fa-solid fa-right-from-bracket"></i>
</button>
  </nav>

  <!-- Views -->
  <main>
    <!-- Home view -->
    <section id="view-home" class="view">
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="images/group1.jpg" alt="Group 1" /></div>
          <div class="swiper-slide"><img src="images/group2.jpg" alt="Group 2" /></div>
          <div class="swiper-slide"><img src="images/group3.jpg" alt="Group 3" /></div>
        </div>
        <div class="swiper-pagination"></div>
      </div>

    <!-- Login view -->
    <section id="view-login" class="view" style="">
      <h2>Login</h2>
      <form id="loginForm" class="login-form">
        <label>Username</label>
        <input id="username" required placeholder="" />
        <label>Password</label>
        <input id="password" type="password" required placeholder="" />
        <button type="submit">Login</button>
        <p id="loginError" class="error" style="display:none;"></p>
      </form>
    </section>

    <section id="view-table" class="view" style="display:none;">
      <div class="table-header">
        <button id="btnAddIO" class="add-btn">
          ➕ Add New IO
      </button>
    
    
    <button id="btnExport" class="export-btn">
        <i class="fa-solid fa-file-excel"></i>
        Export Excel
    </button>
    
    <button id="btnReport" class="report-btn">
        <i class="fa-solid fa-chart-column"></i>
        Report
    </button>
      </div>
      <div class="table-card">
        <div id="recordInfo" class="record-info"></div>
      <table border="1" id="ioTable">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Date</th>
            <th>IO Number</th>
            <th>Colour</th>
            <th>Size</th>
            <th>Quantity</th>
            <th>Total</th>
          </tr>
          <tr>
            <th></th>
            <th></th>
            <th><input type="text" id="filterIo" placeholder="Filter IO"></th><th>
              <select id="filterColour" class="filter-select">
                <option value="">All Colours</option>
            </select>
            </th>
            <th>
            <select id="filterSize" class="filter-select">
                <option value="">All Sizes</option>
            </select>
            </th>
            <th><input type="text" id="filterQty" placeholder="Filter Qty"></th>
            <th></th>
            
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      
      <div id="pagination" class="pagination"></div>
      </div>
    </section>
    <div id="ioModal" class="modal">
      <div class="modal-content">
    
        <div class="modal-header">
          <h2>Add IO</h2>
          <span class="close">&times;</span>
        </div>
    
        <div class="form-row">
          <label>IO Number</label>
          <input type="text" id="ioNumber">
        </div>
    
        <div class="form-row">
          <label>Colour</label>
          <select id="colour">
            <option value="">Select Colour</option>
            <option>Black</option>
            <option>Blue</option>
            <option>Dark Gray</option>
            <option>Light Gray</option>
            <option>Black</option>
            <option>Green</option>
           <option>Red</option>
          </select>
        </div>
    
        <hr>
    
        <div id="sizeContainer">
    
          <div class="size-row">
            <select class="size">
              <option value="">Select Size</option>
              <option>S</option>
              <option>M</option>
              <option>L</option>
              <option>XL</option>
              <option>XXL</option>
            </select>
    
            <input type="number"
                   class="qty"
                   placeholder="Quantity">
    
            <button type="button"
                    class="add-size">+</button>
          </div>
    
        </div>
    
        <button id="saveIO" class="save-btn">
          Save
        </button>
    
      </div>
    </div>
    <div id="reportModal" class="modal">

      <div class="modal-content">
    
        <span id="closeReportModal" class="close">&times;</span>
    
        <h2>Generate Report</h2>
    
        <div class="form-group">
          <label>From Date</label>
          <input type="date" id="fromDate">
        </div>
    
        <div class="form-group">
          <label>To Date</label>
          <input type="date" id="toDate">
        </div>
    
        <button id="btnGenerateReport">
          Generate Report
        </button>
    
      </div>
    
    </div>
  </main>

 
 
  <!-- load main script (script.js does fetch('data.json')) -->
  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</body>
</html>
